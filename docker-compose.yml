  backend:
    build: ./server
    container_name: mern-backend
    # Câu 83: Ánh xạ port 5000 cho backend
    ports:
      - "5000:5000"
    # Câu 85: Cấu hình biến môi trường MONGODB_URI
    environment:
      - MONGODB_URI=mongodb+srv://sieut366_db_user:sieu25022005chuong@cluster0.h3rcwpg.mongodb.net/test?retryWrites=true&w=majority
